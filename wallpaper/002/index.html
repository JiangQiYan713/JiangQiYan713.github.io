<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JiangQiYan壁纸</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0619;color:#f9edff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
#wallpaper{position:fixed;inset:0;width:100%;height:100%;display:block}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,3,24,.35);backdrop-filter:blur(8px);z-index:8;transition:opacity .65s;pointer-events:none}.loading.loaded{opacity:0}
.loaderText{font-size:14px;letter-spacing:.04em;text-shadow:0 0 24px #e970ff}
.hud{position:fixed;bottom:18px;left:18px;padding:10px 14px;border:1px solid #ffffff19;background:#0e0a2180;border-radius:12px;backdrop-filter:blur(10px);font-size:12px;color:#d9c2e5;transition:opacity .3s;user-select:none;pointer-events:none}
.hud.hidden{opacity:0}.hud strong{display:block;color:#fff;font-weight:600;font-size:13px;margin-bottom:3px}
</style></head><body>
<canvas id="wallpaper" aria-label="OC 霓虹城市动态壁纸"></canvas>
<div class="loading"><div class="loaderText" id="loadStatus">正在加载资源…</div></div>
<div class="hud hidden"><strong>OC NEON · V4</strong>背景 / 左侧头发 / 右侧头发 / 人物主体<br>鼠标移动可影响粒子 · 按 H 隐藏提示<br><span id="debugState">按 D 检查图层</span> · 1–4 单层 / 0 全部</div>
<script src="scene_pack/scene.js"></script>
<script src="app.js"></script>
</body></html>
