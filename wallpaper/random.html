<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>随机跳转</title>
</head>
<body>
    <p id="msg">扫描中...</p>
    <script>
        const MAX = 999;
        const PAD = 3;

        const msg = document.getElementById('msg');

        function pad(n) {
            return String(n).padStart(PAD, '0');
        }

        async function exists(path) {
            try {
                const r = await fetch(path + '/index.html', { method: 'HEAD' });
                return r.ok;
            } catch {
                return false;
            }
        }

        async function scan() {
            const found = [];
            for (let n = 1; n <= MAX; n++) {
                const name = pad(n);
                if (await exists(name)) {
                    found.push(name);
                    msg.textContent = `已找到 ${found.length} 个... (当前 ${name})`;
                } else {
                    break; // 遇到断号直接停止
                }
            }

            if (found.length === 0) {
                msg.textContent = '没有找到任何有效文件夹';
                return;
            }

            const pick = found[Math.floor(Math.random() * found.length)];
            msg.textContent = `共 ${found.length} 个，跳转到 ${pick}...`;
            location.href = pick; // 直接写 /010，服务器会自动找 index.html
        }

        scan();
    </script>
</body>
</html>
