<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>壁纸随机跳转中。。。</title>
</head>
<body>
    <button id="btn" disabled>扫描中...</button>
    <script>
        const MAX = 999;        // 最多探测到多少号
        const PAD = 3;          // 编号补零位数
        const CONCURRENCY = 20; // 并发数，避免一次发太多请求

        const btn = document.getElementById('btn');
        const found = [];

        function pad(n) {
            return String(n).padStart(PAD, '0');
        }

        async function exists(path) {
            try {
                const r = await fetch(path + '/index.html', { method: 'HEAD' });
                return r.ok;
            } catch {
                return false;
            }
        }

        async function scan() {
            const nums = Array.from({ length: MAX }, (_, i) => i + 1);

            for (let i = 0; i < nums.length; i += CONCURRENCY) {
                const batch = nums.slice(i, i + CONCURRENCY);
                const results = await Promise.all(
                    batch.map(async n => {
                        const name = pad(n);
                        return (await exists(name)) ? name : null;
                    })
                );
                results.forEach(r => { if (r) found.push(r); });
                btn.textContent = `扫描中... ${i + batch.length}/${MAX}`;
            }

            if (found.length === 0) {
                btn.textContent = '没有找到任何有效壁纸';
                return;
            }
            found.sort();
            btn.disabled = false;
            btn.textContent = `随机打开 (共 ${found.length} 个)`;
            btn.onclick = () => {
                const pick = found[Math.floor(Math.random() * found.length)];
                location.href = pick + '/index.html';
            };
        }

        scan();
    </script>
</body>
</html>
